# Shared cluster only. Runs after tenant-auth (both are PreRouting) and overwrites x-tenant with the
# authenticated tenant, so a client can never choose another tenant's route, backend, or provider key.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: tenant-routing
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  traffic:
    phase: PreRouting
    transformation:
      request:
        set:
          - name: x-tenant
            value: 'apiKey.tenant'
