# The one agentgateway controller in the shared cluster.
controller:
  replicaCount: 1
  xds:
    mode: tls
  extraEnv:
    AGW_ENABLE_EXPERIMENTAL_GATEWAY_API_FEATURES: "false"
rbac:
  gatewayNamespaces:
    - agentgateway-system
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 5s
  proxy:
    podMonitor:
      enabled: true
    gatewayClassNames:
      - agentgateway
  grafanaDashboard:
    enabled: false
